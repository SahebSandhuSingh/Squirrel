[project]
name = "squirrel-pose-backend"
version = "0.1.0"
description = "Live pose recognition and exercise classification for push-ups and arm curls"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ has no __init__.py, so pytest puts it on sys.path and the shared
# helpers (synthetic_poses, stub_estimator) import by plain module name.
pythonpath = [".", "tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
