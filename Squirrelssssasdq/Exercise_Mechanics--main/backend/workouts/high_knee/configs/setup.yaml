# Exact front-view baseline landmarks. Wrists and elbows are intentionally absent because natural
# High Knee arm action varies and must not block setup.
schema_version: 1
exercise: high_knee

keypoints:
  - left_shoulder
  - right_shoulder
  - left_hip
  - right_hip
  - left_knee
  - right_knee
  - left_ankle
  - right_ankle

pre_check:
  enabled: true
  stable_ms: 2000

baseline:
  required: true
  file: high_knee_baseline_keypoints.json
  capture:
    duration_ms: 3000
    min_valid_samples: 45
    min_valid_coverage: 0.80
    invalid_pause_ms: 250
    invalid_reset_ms: 1000
    max_joint_stddev_px: 8
