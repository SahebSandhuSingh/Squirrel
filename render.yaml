# Render Blueprint, free plan: both backends and Redis, from this repository (Dashboard → New →
# Blueprint). The web app goes to Vercel (vercel.json); the database is Supabase. Steps: DEPLOY.md.
#
#   squirrel-exercise   Exercise Mechanics API + live-coaching sockets
#   squirrel-run-api    Run Module API, with its background workers in the same process
#                       (RUN_WORKERS_IN_API) and its migrations applied at startup (MIGRATE_ON_START)
#   squirrel-social     Profile + Social API: profiles, follows, posts, feed, crews, events, challenges,
#                       waitlist, boards and notifications (Alembic migrations at startup). Finished
#                       workouts, runs and territory steals are published to it by the other two.
#   squirrel-campus     campus-service: named zones, territory (claim/steal/defend), map, presence,
#                       heatmap, shared zones. Its OWN database (a second Supabase project with
#                       PostGIS), migrations and placeholder zones at startup, worker in-process.
#                       Accepts RS256 tokens only: create it after the RS256 switch (DEPLOY.md §2e).
#   squirrel-redis      Render Key Value (Redis) for the Run Module's queues and leaderboard
#
# The free plan has no disks, background workers or pre-deploy commands, hence the two switches
# above. Free services sleep after 15 minutes without requests and wake on the next one (about a
# minute), and their files are wiped then: accounts, profiles, runs, territory and XP are in
# Supabase and stay; the Exercise backend's session files (workout history screens) do not.
#
# Values marked `sync: false` are asked for when the Blueprint is created and never stored here.
# DATABASE_URL names Supabase's CA certificate at /etc/secrets/prod-ca-2021.crt: add that file as a
# Secret File on the `squirrel-shared` environment group (see DEPLOY.md), then redeploy.

envVarGroups:
  - name: squirrel-shared
    envVars:
      # Sign-in tokens: the Exercise backend signs them, the Run Module and the Social service check
      # them. HS256: JWT_SECRET is the shared secret. RS256 (DEPLOY.md §2d): JWT_SECRET is the PUBLIC
      # key (PEM), JWT_ALGORITHM is RS256, and squirrel-exercise holds the private key. Both are set
      # in the dashboard (sync: false) so a Blueprint sync never flips them back.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        sync: false
      # XP day for activities that do not carry the phone's own time zone (ADR-027).
      - key: XP_TIMEZONE
        value: Asia/Kolkata
      # Service-to-service password: the Exercise backend and the Run Module publish finished
      # workouts and runs to squirrel-social's /internal/v1/activities with it.
      - key: SOCIAL_INTERNAL_TOKEN
        generateValue: true

services:
  - type: web
    name: squirrel-exercise
    runtime: docker
    region: singapore
    plan: free
    branch: saheb
    dockerfilePath: ./Exercise_Mechanics--main/Dockerfile
    dockerContext: ./Exercise_Mechanics--main
    healthCheckPath: /
    envVars:
      - fromGroup: squirrel-shared
      # RS256 only (DEPLOY.md §2d): add the private key as a Secret File jwt-private.pem on this
      # service, then set JWT_PRIVATE_KEY_FILE=/etc/secrets/jwt-private.pem. Unset: HS256.
      - key: DATABASE_URL
        sync: false
      # The Vercel web app's address(es), comma-separated; `*` for preview URLs (backend/cors.py).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Partner Hunt's XP gate: the Run Module's public address, e.g. https://squirrel-run-api.onrender.com
      # (free services cannot receive private-network traffic).
      - key: RUN_MODULE_URL
        sync: false
      # squirrel-social's public address, e.g. https://squirrel-social.onrender.com (unset: workouts
      # are not published to profiles).
      - key: SOCIAL_API_URL
        sync: false
      - key: EXERCISE_REQUIRE_AUTH
        value: "1"
      - key: MODERATION_TOKEN
        generateValue: true
      - key: SQUIRREL_PUBLIC_BASE_URL
        value: https://squirrelsocial.app
      # Sign-up is open to these email domains only (ac.in: any Indian college address), and needs the 6-digit code emailed to the
      # address (backend/auth/email_codes.py). "*" would open it to any address.
      - key: SQUIRREL_ALLOWED_EMAIL_DOMAINS
        value: ac.in
      - key: SQUIRREL_EMAIL_VERIFICATION
        value: "on"
      # How the codes are emailed (backend/mailer.py). Gmail: SMTP_USER = the Gmail address,
      # SMTP_PASSWORD = an app password. Render's free plan blocks outgoing SMTP ports, so on it set
      # RESEND_API_KEY (+ EMAIL_FROM on a domain verified with Resend) instead. With neither, codes
      # only go to the service log.
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

  - type: web
    name: squirrel-run-api
    runtime: docker
    region: singapore
    plan: free
    branch: saheb
    dockerfilePath: ./run-module/Dockerfile
    dockerContext: ./run-module
    healthCheckPath: /health
    envVars:
      - fromGroup: squirrel-shared
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: squirrel-redis
          property: connectionString
      - key: MIGRATE_ON_START
        value: "1"
      - key: RUN_WORKERS_IN_API
        value: "1"
      # squirrel-social's public address (unset: runs are not published to profiles).
      - key: SOCIAL_API_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

  - type: web
    name: squirrel-social
    runtime: docker
    region: singapore
    plan: free
    branch: saheb
    dockerfilePath: ./squirrel-social-profile-social-fixed/social-backend/Dockerfile
    dockerContext: ./squirrel-social-profile-social-fixed/social-backend
    healthCheckPath: /healthz
    envVars:
      # JWT_SECRET + JWT_ALGORITHM: verifies the same sign-in tokens as the other two (app/config.py).
      - fromGroup: squirrel-shared
      # The same Supabase URL as the other two (its tables do not collide with theirs).
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # XP and run stats are read from the Run Module with the caller's token, e.g.
      # https://squirrel-run-api.onrender.com
      - key: SOCIAL_RUN_MODULE_URL
        sync: false
      # Photo uploads need S3-compatible storage (SOCIAL_MEDIA_* in social-backend/.env.example);
      # without it everything else works and uploads answer 503.
      # Hostels members pick from for hostel vs hostel, comma-separated (unset: hidden).
      - key: SOCIAL_HOSTELS
        sync: false
      # Named campus zones for Squirrel Dates (JSON; format in social-backend/README.md). Upload
      # campus-zones.json as a Secret File and set /etc/secrets/campus-zones.json (unset: Dates off).
      - key: SOCIAL_ZONES_FILE
        sync: false
      # The web app's address, for invite links, e.g. https://squirrel-social.vercel.app
      - key: SOCIAL_APP_URL
        sync: false
      # Only if the Expo project has "enhanced push security" on (expo.dev → project → Access tokens).
      - key: EXPO_ACCESS_TOKEN
        sync: false

  - type: web
    name: squirrel-campus
    runtime: docker
    region: singapore
    plan: free
    branch: saheb
    dockerfilePath: ./campus-service/Dockerfile
    dockerContext: ./campus-service
    healthCheckPath: /healthz
    envVars:
      # For SOCIAL_INTERNAL_TOKEN (names and profile ids come from squirrel-social) and the Supabase
      # CA file. campus-service ignores JWT_SECRET / JWT_ALGORITHM: it verifies with AUTH_JWKS_URL.
      - fromGroup: squirrel-shared
      # A SECOND Supabase project (PostGIS on), not the shared one: its own migrations and ledger.
      - key: DATABASE_URL
        sync: false
      # https://squirrel-exercise.onrender.com/api/auth/jwks.json (RS256 only). Leave AUTH_ISSUER and
      # AUTH_AUDIENCE unset: the Exercise tokens carry neither claim.
      - key: AUTH_JWKS_URL
        sync: false
      # https://squirrel-social.onrender.com
      - key: SOCIAL_API_URL
        sync: false
      # The Vercel address(es), comma-separated.
      - key: CORS_ORIGINS
        sync: false
      # wss://squirrel-campus.onrender.com/v1/realtime (unset: the app refreshes on focus).
      - key: REALTIME_PUBLIC_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: MIGRATE_ON_START
        value: "1"
      # Hostels + placeholder zones (geometry_source = dev_placeholder); real outlines replace them.
      - key: SEED_ZONES_ON_START
        value: "1"
      # The verification worker runs inside the API (one free service; it pauses while asleep).
      - key: WORKER_INLINE
        value: "1"

  - type: keyvalue
    name: squirrel-redis
    region: singapore
    plan: free
    maxmemoryPolicy: noeviction   # BullMQ queues must never be evicted
    ipAllowList: []               # private network only
