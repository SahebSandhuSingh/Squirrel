# Both backends share one PostgreSQL + PostGIS database (Supabase in production). They migrate and
# write their own tables independently, so the one thing that can break the other is a name clash.
# This runs scripts/check_shared_database.py whenever either module's migrations change.
name: Shared database

on:
  push:
    paths:
      - "Exercise_Mechanics--main/backend/db/**"
      - "run-module/db/migrations/**"
      - "run-module/backend/package-lock.json"
      - "scripts/check_shared_database.py"
      - ".github/workflows/shared-database.yml"
  pull_request:
    paths:
      - "Exercise_Mechanics--main/backend/db/**"
      - "run-module/db/migrations/**"
      - "run-module/backend/package-lock.json"
      - "scripts/check_shared_database.py"
      - ".github/workflows/shared-database.yml"

jobs:
  no-collisions:
    name: Exercise + Run Module migrations coexist
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Exercise_Mechanics--main/requirements.txt
      - run: pip install -r Exercise_Mechanics--main/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: run-module/backend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: run-module/backend

      - run: python scripts/check_shared_database.py postgresql://postgres:postgres@localhost:5432/postgres
