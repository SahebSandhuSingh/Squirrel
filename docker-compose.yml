# The three backends, side by side, on ONE PostgreSQL + PostGIS database.
#
#   cp .env.example .env        # then set JWT_SECRET (and DATABASE_URL for Supabase)
#   docker compose up --build
#
#   Exercise Mechanics   http://localhost:8000
#   Run Module API       http://localhost:3000/health
#   Social               http://localhost:8100/healthz
#
# Each module migrates and writes its own tables through its own code (Exercise: backend/db, Python;
# Run Module: node-pg-migrate + db/queries; Social: Alembic); they only share the database server.
# `scripts/check_shared_database.py` proves their tables never collide. Over HTTP: Exercise asks the
# Run Module for XP (Partner Hunt), Social reads XP and runs from it, and Exercise and the Run Module
# publish finished workouts and runs to Social (SOCIAL_API_URL + SOCIAL_INTERNAL_TOKEN).
#
# By default the database is the local `postgres` service below. For Supabase, set DATABASE_URL in
# .env and drop `local-db` from COMPOSE_PROFILES; nothing else changes. See README.md.

name: squirrel

x-database-url: &database-url ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/squirrel}
x-redis-url: &redis-url ${REDIS_URL:-redis://redis:6379}
x-social-token: &social-token ${SOCIAL_INTERNAL_TOKEN:-local-social-service-token}

x-run-module: &run-module
  build:
    context: ./run-module
    dockerfile: ../deploy/run-module.Dockerfile
  image: squirrel-run-module
  environment:
    DATABASE_URL: *database-url
    REDIS_URL: *redis-url
    PORT: "3000"
    NODE_ENV: ${RUN_MODULE_NODE_ENV:-production}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (see .env.example)}
    JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    JWT_ISSUER: ${JWT_ISSUER:-}
    JWT_AUDIENCE: ${JWT_AUDIENCE:-}
    XP_TIMEZONE: ${XP_TIMEZONE:-Asia/Kolkata}   # day boundary for the XP daily caps
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}   # web app origins allowed to call the API
    SOCIAL_API_URL: http://social:8100   # finalized runs are published to profiles
    SOCIAL_INTERNAL_TOKEN: *social-token
  volumes:
    - ./deploy/certs:/certs:ro   # database CA certificate(s), referenced from DATABASE_URL

services:
  # ---- shared infrastructure ------------------------------------------------------------------

  postgres:
    profiles: ["local-db"]
    image: postgis/postgis:16-3.4    # same image as the Run Module's own compose and CI
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: squirrel
    ports:
      - "${POSTGRES_HOST_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP, not the socket: on first start the image runs a socket-only setup server, then
      # restarts. A socket check passes during setup, and clients that connect then are refused.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d squirrel"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:  # Run Module queues (BullMQ) and leaderboard cache. Supabase has no Redis.
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---- Run Module (Node) ----------------------------------------------------------------------

  run-migrate:
    <<: *run-module
    command: ["node", "node_modules/node-pg-migrate/bin/node-pg-migrate.js", "up",
              "--migrations-dir", "../db/migrations", "--database-url-var", "DATABASE_URL"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres: { condition: service_healthy, required: false }
    restart: "no"

  run-api:
    <<: *run-module
    ports:
      - "${RUN_MODULE_HOST_PORT:-3000}:3000"
    depends_on:
      run-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    # One check at startup: every 2 s until /health first answers, then no more (the next would be
    # a year away), so the log is not filled with /health requests.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      start_period: 60s
      start_interval: 2s
      interval: 8760h
      timeout: 5s
      retries: 3
    restart: unless-stopped

  run-worker:
    <<: *run-module
    command: ["node", "--import", "tsx/esm", "src/workers/start.ts"]
    stop_signal: SIGINT   # the worker closes its queues on SIGINT only
    depends_on:
      run-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # ---- Exercise Mechanics (Python) ------------------------------------------------------------

  exercise:
    build: ./Exercise_Mechanics--main
    image: squirrel-exercise
    environment:
      # psycopg takes the same postgres:// URL; it applies its own migrations at startup. Accounts and
      # profiles live in this database; sessions stay in the exercise_data volume.
      DATABASE_URL: *database-url
      MODERATION_TOKEN: ${MODERATION_TOKEN:-}
      # Partner Hunt asks the Run Module for XP (its /v1/users/{id}/xp-gate), with a service token this
      # backend signs with JWT_SECRET. HTTP only: the two still never touch each other's tables.
      RUN_MODULE_URL: ${RUN_MODULE_URL:-http://run-api:3000}
      # Accounts: this backend signs login tokens with the Run Module's JWT_SECRET, so one sign-in
      # works on both. Every /api/users/{id}/... route needs that user's token; EXERCISE_REQUIRE_AUTH=0
      # switches the check off (only for trying the password-less browser coach locally).
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (see .env.example)}
      EXERCISE_REQUIRE_AUTH: ${EXERCISE_REQUIRE_AUTH:-1}
      SQUIRREL_PUBLIC_BASE_URL: ${SQUIRREL_PUBLIC_BASE_URL:-https://squirrelsocial.app}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}   # web app origins allowed to call the API
      SOCIAL_API_URL: http://social:8100   # finished workouts are published to profiles
      SOCIAL_INTERNAL_TOKEN: *social-token
    ports:
      - "${EXERCISE_HOST_PORT:-8000}:8000"
    volumes:
      - exercise_data:/app/data   # session captures and calibration (accounts/profiles are in the database)
      - ./deploy/certs:/certs:ro
    depends_on:
      postgres: { condition: service_healthy, required: false }
    restart: unless-stopped

  # ---- Social (Python): profiles, follows, posts, feed ----------------------------------------

  social:
    build: ./squirrel-social-profile-social-fixed/social-backend
    image: squirrel-social
    environment:
      # Alembic migrates at startup (its Dockerfile). The plain postgres:// URL is fine (app/config.py).
      DATABASE_URL: *database-url
      # The same sign-in tokens as the other two: the HS256 secret the Exercise backend signs with.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (see .env.example)}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      SOCIAL_INTERNAL_TOKEN: *social-token
      SOCIAL_RUN_MODULE_URL: http://run-api:3000   # XP and run stats, with the caller's token
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      PORT: "8100"
    ports:
      - "${SOCIAL_HOST_PORT:-8100}:8100"
    volumes:
      - ./deploy/certs:/certs:ro
    depends_on:
      postgres: { condition: service_healthy, required: false }
    restart: unless-stopped

volumes:
  postgres_data:
  exercise_data:
