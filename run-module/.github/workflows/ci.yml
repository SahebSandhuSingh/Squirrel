name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-typecheck-test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/run_module_test
          REDIS_URL: redis://localhost:6379
          PORT: "3000"
          NODE_ENV: test
          LOG_LEVEL: silent

  # RM-2.6: geometry determinism tests.
  # Triggered on any push or pull_request that touches geometry source or
  # SQL queries.  Uses a paths filter so it runs on pull_request events too
  # (head_commit.modified is null on PR events — see RM-2.6 for details).
  geometry-determinism:
    name: Geometry Determinism Tests
    runs-on: ubuntu-latest

    # Trigger on paths — works for both push and pull_request.
    # The previous contains(head_commit.modified) approach was push-only
    # and silently skipped on pull_request events.
    on:
      push:
        paths:
          - "backend/src/geometry/**"
          - "db/queries/**"
      pull_request:
        paths:
          - "backend/src/geometry/**"
          - "db/queries/**"

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: run_module_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run migrations (create schema + PostGIS extension)
        run: npm run migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/run_module_test

      - name: Run geometry tests (includes determinism harness)
        run: npm run test:geometry
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/run_module_test
          REDIS_URL: redis://localhost:6379
          PORT: "3000"
          NODE_ENV: test
          LOG_LEVEL: silent
