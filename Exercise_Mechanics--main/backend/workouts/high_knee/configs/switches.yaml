# Setup readiness gates pre-check and every baseline-capture frame. Knee tracking, lateral torso
# lean, ROM, and the informational asymmetry monitor are live development rules. High Knee remains
# on the rig/UI development path.
schema_version: 1

contexts:
  pre_check:
    knee_tracking_corridor: false
    lateral_torso_lean: false
    knee_drive_rom: false
    left_right_asymmetry: false
    setup_readiness: true

  baseline_capture:
    knee_tracking_corridor: false
    lateral_torso_lean: false
    knee_drive_rom: false
    left_right_asymmetry: false
    setup_readiness: true

  live:
    # knee_tracking_corridor (bands 0.20/0.28) and lateral_torso_lean (bands 5/8 deg) are both live
    # for rig testing/validation — their thresholds are still provisional, so their live scores and
    # cues are under test until captures confirm them. left_right_asymmetry stays live as an unscored
    # monitor (the frontend timed contract requires its presence).
    knee_tracking_corridor: true
    lateral_torso_lean: true
    knee_drive_rom: true
    left_right_asymmetry: true
    setup_readiness: false
